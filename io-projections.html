<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Per-model KV cache offload storage IO projections: block geometry and measured NVMe store/load cost"
        />
        <title>KV Cache Offload Storage IO Projections</title>
        <style>
            :root {
                --primary-blue: #1428a0;
                --light-blue: #5fa3e6;
                --accent-purple: #691fff;
                --accent-cyan: #00d4ff;
                --dark-ink: #0b1026;
                --surface: rgba(10, 16, 44, 0.92);
                --border: rgba(95, 163, 230, 0.45);
                --text-primary: #eaf2ff;
                --text-secondary: #c7d4f8;
                --text-muted: #a5b4e0;
                --accent-warn: #ff6b00;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font-family:
                    'Segoe UI',
                    -apple-system,
                    sans-serif;
                background: var(--dark-ink);
                color: var(--text-primary);
                line-height: 1.5;
            }
            .wrap {
                max-width: 1080px;
                margin: 0 auto;
                padding: 24px 16px 60px;
            }
            h1 {
                font-size: 26px;
                margin: 8px 0 4px;
            }
            .sub {
                color: var(--text-secondary);
                margin-bottom: 18px;
            }
            .card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 16px;
                margin: 14px 0;
                overflow-x: auto;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                font-size: 13.5px;
                min-width: 900px;
            }
            th,
            td {
                padding: 7px 9px;
                text-align: right;
                border-bottom: 1px solid rgba(95, 163, 230, 0.18);
                white-space: nowrap;
            }
            th {
                color: var(--text-muted);
                font-weight: 600;
                font-size: 12px;
            }
            td.model,
            th.model {
                text-align: left;
                font-weight: 600;
            }
            .family {
                color: var(--text-muted);
                font-size: 11px;
                font-weight: 400;
            }
            .barcell {
                min-width: 160px;
            }
            .bar {
                height: 12px;
                border-radius: 6px;
                background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
                display: inline-block;
                vertical-align: middle;
            }
            .bar.load {
                background: linear-gradient(90deg, var(--primary-blue), var(--light-blue));
            }
            .note {
                color: var(--text-muted);
                font-size: 12.5px;
            }
            a {
                color: var(--accent-cyan);
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <h1>KV Cache Offload Storage IO</h1>
            <div class="sub">
                The memory envelope says how big the KV cache is. This page says what moving it to storage costs: each
                model's 256-token offload block, the NVMe command stream it becomes, and measured store/load cost on a
                real device.
            </div>
            <div class="card">
                <table id="tbl"></table>
            </div>
            <div class="card note" id="method"></div>
        </div>
        <script>
            const DATA = {
                schema: 1,
                what: "Per-model KV-cache offload storage-IO projections: the calculator's exact block geometry plus measured store/load on real NVMe",

                    generator:
                        'LMCache examples/kv_cache_offload_io/run_kv_offload_io.py (kv_geometry.py = the kv_cache_calculator math)',
                    chunk_tokens: 256,
                    dtype: 'bfloat16',
                    engine: 'io_uring, O_DIRECT, file on xfs',
                    command_bytes: 131072,
                    command_note:
                        'the kernel splits file I/O at max_sectors_kb (128 KiB on this host); projected command counts use the same 128 KiB quantum',
                    measured_workload:
                        '8 blocks stored then loaded, 3 measured passes after 1 warmup pass, one object in flight (per-object cost, not peak device throughput)',
                    device: 'Micron 7450 (MTFDKBG960TFR 960 GB), shared host -- treat measured numbers as representative, not pristine',

                    {

                        family: 'default',
                        kv_block_bytes_256tok: 132120576,
                        kv_bytes_per_token: 516096.0,
                        dtype: 'bfloat16',
                        store_cmds_per_block: 1009,
                        store_bytes_per_block: 132124672,
                        load_cmds_per_block: 1008,
                        load_bytes_per_block: 132120576,
                        measured: {
                            store: { p50_ms: 346.103, p99_ms: 368.183, MBps: 391.2 },
                            load: { p50_ms: 127.106, p99_ms: 133.421, MBps: 1041.8 },
                        },
                        cmd_bytes: 131072,
                    },
                ],
            }
            async function load() {
                let d = DATA
                if (!d) {
                    const r = await fetch('projections/io/kvio_io_projections.json')
                    d = await r.json()
                }
                render(d)
            }
            function fmtMiB(b) {
                return (b / 1048576).toFixed(1) + ' MiB'
            }
            function fmtKB(b) {
                return (b / 1024).toFixed(1) + ' KB'
            }
            function render(d) {
                const maxTok = Math.max(...d.models.map((m) => m.kv_bytes_per_token))
                const maxLoad = Math.max(...d.models.map((m) => (m.measured.load || {}).MBps || 0))
                let h =
                    '<tr><th class="model">model</th><th>KV / 256 tok</th>' +
                    '<th>bytes / token</th><th class="barcell"></th>' +
                    '<th>cmds / block</th><th>load MB/s</th>' +
                    '<th class="barcell"></th><th>load p50</th>' +
                    '<th>store MB/s</th></tr>'
                for (const m of d.models) {
                    const s = m.measured.store || {}
                    const l = m.measured.load || {}
                    const wTok = (100 * m.kv_bytes_per_token) / maxTok
                    const wLoad = (100 * (l.MBps || 0)) / maxLoad
                    h +=
                        '<tr><td class="model">' +
                        m.model +
                        ' <span class="family">' +
                        (m.family || '') +
                        '</span></td>' +
                        '<td>' +
                        fmtMiB(m.kv_block_bytes_256tok) +
                        '</td><td>' +
                        fmtKB(m.kv_bytes_per_token) +
                        '</td><td class="barcell"><span class="bar" style="width:' +
                        wTok +
                        '%"></span></td><td>' +
                        (m.load_cmds_per_block || '-') +
                        '</td><td>' +
                        (l.MBps ? l.MBps.toFixed(0) : '-') +
                        '</td><td class="barcell"><span class="bar load" style="width:' +
                        wLoad +
                        '%"></span></td><td>' +
                        (l.p50_ms ? l.p50_ms.toFixed(1) + ' ms' : '-') +
                        '</td><td>' +
                        (s.MBps ? s.MBps.toFixed(0) : '-') +
                        '</td></tr>'
                }
                document.getElementById('tbl').innerHTML = h
                document.getElementById('method').innerHTML =
                    '<b>Method.</b> ' +
                    d.method.generator +
                    ' — ' +
                    d.method.measured_workload +
                    '. Device: ' +
                    d.method.device +
                    '. Command quantum: 128 KiB (' +
                    d.method.command_note +
                    '). Numbers are per-block cost, not peak device ' +
                    'throughput. Data: <a href="projections/io/' +
                    'kvio_io_projections.json">kvio_io_projections.json</a>.'
            }
            load()
        </script>
    </body>
</html>
